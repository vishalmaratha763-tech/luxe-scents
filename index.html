<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxe Scents | Royal Collection</title>

<style>
:root{
  --gold:#d4af37;
  --gold-grad:linear-gradient(45deg,#bf953f,#fcf6ba,#b38728,#fbf5b7,#aa771c);
  --dark:#0b0b0b;
  --card:#151515;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#1a1a1a,#000);
  color:#fff;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(212,175,55,.3);
  padding:25px 15px;
  text-align:center;
}

.logo{
  font-size:34px;
  font-weight:900;
  letter-spacing:6px;
  background:var(--gold-grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:15px;
}

.search-box{
  width:100%;
  max-width:480px;
  padding:14px 22px;
  border-radius:50px;
  border:1px solid #444;
  background:#111;
  color:#fff;
  font-size:15px;
  outline:none;
}

/* GRID */
.container{
  max-width:1300px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:25px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:25px;
  overflow:hidden;
  border:1px solid #2a2a2a;
  transition:.4s;
}
.card:hover{
  transform:translateY(-10px);
  box-shadow:0 15px 40px rgba(212,175,55,.25);
  border-color:var(--gold);
}

/* IMAGE FIX */
.img-box{
  background:#fff;
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.img-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* BADGE */
.badge{
  position:absolute;
  margin:12px;
  padding:6px 14px;
  font-size:10px;
  font-weight:700;
  color:#000;
  background:var(--gold-grad);
  border-radius:50px;
}

/* INFO */
.info{
  padding:18px;
  text-align:center;
}
.info h3{
  font-size:15px;
  margin-bottom:10px;
}
.price{
  font-size:20px;
  color:var(--gold);
  font-weight:800;
}
.old-price{
  font-size:13px;
  text-decoration:line-through;
  color:#777;
  margin-left:6px;
}

/* BUTTON */
.buy-btn{
  display:block;
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:var(--gold-grad);
  color:#000;
  font-size:12px;
  font-weight:900;
  text-decoration:none;
}

/* FOOTER */
footer{
  text-align:center;
  padding:35px;
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <div class="logo">LUXE SCENTS</div>
  <input id="searchInput" class="search-box" placeholder="Search luxury fragrances...">
</header>

<div class="container" id="productGrid"></div>

<footer>
  © 2026 LUXE SCENTS PREMIUM | 📞 7878901913
</footer>

<script>
const products = [
 {n:"Royal Oud Gold",p:"2,499",o:"4,999",b:"Best Seller",
  i:"https://images.unsplash.com/photo-1615634260167-c8cdede054de"},
 {n:"Midnight Bloom",p:"1,999",o:"3,499",b:"Trending",
  i:"https://images.unsplash.com/photo-1585386959984-a41552231693"},
 {n:"Ocean Mist",p:"1,599",o:"2,999",b:"New",
  i:"https://images.unsplash.com/photo-1594035910387-fea47794261f"},
 {n:"Rose Velvet",p:"2,100",o:"3,800",b:"Premium",
  i:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519"}
];

const grid=document.getElementById("productGrid");

function render(list){
 grid.innerHTML=list.map(p=>`
  <div class="card">
   <span class="badge">${p.b}</span>
   <div class="img-box">
     <img src="${p.i}"
      alt="${p.n}"
      onerror="this.src='https://via.placeholder.com/400x400?text=Perfume'">
   </div>
   <div class="info">
    <h3>${p.n}</h3>
    <div>
      <span class="price">₹${p.p}</span>
      <span class="old-price">₹${p.o}</span>
    </div>
    <a class="buy-btn"
       href="https://wa.me/917878901913?text=I%20want%20${encodeURIComponent(p.n)}">
       ORDER ON WHATSAPP
    </a>
   </div>
  </div>
 `).join("");
}

render(products);

searchInput.addEventListener("input",e=>{
 const v=e.target.value.toLowerCase();
 render(products.filter(x=>x.n.toLowerCase().includes(v)));
});
</script>

</body>
  </html>
